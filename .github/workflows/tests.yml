# Two tiers: the structural test files on every push, the full suite on
# release tags (and on demand, from the Actions tab). The files ignored by
# the structural job are the ones that train real models or sweep whole
# figure sets; a new test file runs on every push until it earns its way
# onto that list. The sunspot test is deselected even from the full suite
# because it downloads from sidc.be -- a release gate should not depend on
# a third-party server being up.
#
# The release tier is TWO jobs, and the split is load-bearing: as one
# pytest process the full suite killed the 16 GB runner itself on every
# release tag from v0.6.6 to v0.6.8 ("the runner has received a shutdown
# signal", mid-suite, no test failing -- the OOM signature of TensorFlow
# training, matplotlib and pyvista RSS accumulating across 1200+ tests
# plus the whole manual). `test_manual.py` -- seventeen chapters of real
# model training, the heaviest single item and where the kills landed --
# runs alone in its own process; everything else runs in the other. On
# the v0.6.9 tag the manual job died the same way on its own (exit 143
# at 22 minutes of 90), so `test_manual.py` now runs one subprocess per
# chapter; a longer timeout was never the lever. On the v0.6.10 and v0.6.11
# tags the other job went the same way, cancelled at 93-95% with no test
# failing: as one process the suite peaks at 23.1 GB. It runs one process
# per test file now, which bounds it at the heaviest file's peak, 6.1 GB
# (test_uncertain_input_gp.py, measured 2026-09-15). Since 0.8.0 the files
# go through `geoml/test/run_parallel.py`, two at a time, and the manual is
# one test per chapter.
#
# From 0.8.7 to 0.9.5 every job failed this way again, no test failing
# (2026-10-22). The structural job, still one pytest process, lost its
# runner at 40% once `test_batched_experts.py` joined it and at 3% by
# 0.9.5, with `test_expected_kernel.py` and `test_full_variance.py`
# (models trained, 15-20 minutes each locally) on the path. The full job's
# two processes outgrew the 16 GB the runner has ("lost communication with
# the server"), and chapter 17 alone takes an hour on four cores, past the
# manual job's 90 minutes. So the structural job runs one process per file
# too, with the three training files on its ignore list. The full job runs
# one process at a time on all four of the runner's CPUs (by default the
# runner takes half the machine's cores, which gave each of two processes
# one), and even one process was too many for two files: in one process
# test_batched_experts.py peaked at 28.1 GB and test_expected_kernel.py at
# 16.0, each model a test trains leaving its TensorFlow graphs resident.
# The runner runs those two a slice of their tests a process (`SPLIT`).
# Both release jobs have six hours, the most a hosted runner allows.

name: tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: VTK system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1
      - name: Install the package
        run: pip install -e .[geoh5] pytest
      # one process per file, two at a time: as one process the structural
      # files outgrew the runner's 16 GB from 0.8.7 on
      - name: Structural tests, one process per file
        run: |
          ignored="test_real_cases.py test_vgp.py test_experts.py test_qmc.py
            test_mixture.py test_model_persistence.py test_noise_integration.py
            test_early_stopping.py test_progress.py test_priors.py
            test_manual.py test_plots.py test_interactive.py
            test_block_prediction.py test_gaussian_mixture.py
            test_skill_release.py test_batched_experts.py
            test_expected_kernel.py test_full_variance.py"
          files=""
          for f in geoml/test/test_*.py; do
            case " $(echo $ignored) " in
              *" $(basename $f) "*) ;;
              *) files="$files $f" ;;
            esac
          done
          python geoml/test/run_parallel.py --no-manual --cpus 4 -j 2 $files

  full:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: VTK system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1
      - name: Install the package
        run: pip install -e .[geoh5] pytest
      # one at a time on all four CPUs, the two heaviest files a slice of
      # their tests a process (run_parallel.py's SPLIT): alone in one
      # process they peaked at 28.1 and 16.0 GB, the runner has 16
      - name: Full suite, one process per file, the manual aside
        run: python geoml/test/run_parallel.py --no-manual --cpus 4 -j 1

  manual:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # chapter 17 alone takes an hour on four cores
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: VTK system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1
      - name: Install the package
        run: pip install -e .[geoh5] pytest
      - name: The manual's chapters
        run: python -m pytest -q geoml/test/test_manual.py
