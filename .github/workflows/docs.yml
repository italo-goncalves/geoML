# The documentation site, in two halves. `build` runs on every push with
# warnings as errors, so a broken reference or a malformed docstring fails
# where it was written; `publish` runs on a release tag and puts the built
# site on GitHub Pages, so what is published is never staler than the last
# release. The type check rides along: it covers the annotated public
# interface listed in pyproject's [tool.pyright], and grows with it.

name: docs

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: VTK system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1
      - name: Install the package
        run: pip install -e .[dev]
      # Reports without blocking, on purpose and not for long. pyright is
      # clean against the maintainer's environment and finds ~90 things
      # against CI's newer dependency stubs, none of them so far about
      # geoML's own code -- the one that was, SciPy's `Sobol(seed=)`
      # rename, is fixed in `stats.random.sobol_engine`. Pinning the four
      # stub-bearing packages to the maintainer's versions was tried to
      # bring the two into line and measured *worse* (159 findings), the
      # rest of the stack still being current. The honest route is to work
      # through CI's list against CI's versions; until that is done, a
      # permanently red required job would only teach everyone to ignore it.
      - name: Type check
        continue-on-error: true
        run: pyright

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: VTK system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1
      # autodoc imports the package, and `stats/probability.py` subclasses a
      # tensorflow-probability distribution, so the real dependencies are
      # installed rather than mocked
      - name: Install the package
        run: pip install -e .[dev]
      - name: Build the site
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/build/html

  publish:
    # a release publishes; `workflow_dispatch` is how the deployment itself
    # can be exercised without cutting one
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is not optional here: declaring any permissions
      # block sets every scope left out of it to none, and
      # `configure-pages` reads the repository before it reads the Pages
      # settings. Without it the step fails before the deployment starts.
      contents: read
      pages: write
      id-token: write
    # There is a second gate, and it does not live in this file: the
    # `github-pages` environment carries a custom deployment policy listing
    # the refs allowed to deploy. It listed only the branch `master`, so
    # this job -- which runs on a tag -- was rejected before its first
    # step, failing in a second with an empty step list. A tag policy for
    # `v*` was added alongside the branch one in 0.6.4. Anyone debugging a
    # publish that fails with no steps should look at the environment's
    # policies before reading a line of YAML, and beware that verifying
    # this job by `workflow_dispatch` from master exercises the ref the
    # policy always allowed rather than the tag it is really run on.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
