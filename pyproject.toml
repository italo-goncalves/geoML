[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoml"
version = "0.6.7"
description = "Machine learning for spatial data"
authors = [
    {name = "Ítalo Gomes Gonçalves", email = "italogoncalves.igg@gmail.com"},
]
license = {text = "GPL3"}
keywords = ["machine learning", "spatial data", "gaussian process"]
requires-python = ">=3.10"
# Hard floors are API facts: zarr 3 (zarr.create_array), pyvista 0.47
# (select_interior_points, added 0.47.0), tensorflow-probability[tf] 0.24
# (the extra that brings tf-keras), vtk 9.1 (vtkLogger control; imported
# directly by data/meshes.py). The rest are era markers -- versions
# comfortably older than anything verified, so a truly ancient environment
# fails at pip with a legible message instead of at runtime.
dependencies = [
    "scikit-image>=0.22",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyvista>=0.47",
    "vtk>=9.1",
    "tensorflow>=2.16",
    "tensorflow-probability[tf]>=0.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "zarr>=3.0",
    "xarray>=2024.1",
    "dask>=2024.1",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "ezdxf>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# What the documentation site and the type check need, and nothing a user
# does: `pip install -e .[dev]`. Pinned exactly, where the runtime
# dependencies are floored: a checker's own rules change between releases,
# and a type check that reports different things on different days is a
# gate nobody reads. Bump these deliberately, and expect findings with it.
dev = [
    "pyright==1.1.411",
    "sphinx==8.2.3",
    "myst-parser==5.1.0",
    "sphinx-rtd-theme==3.1.0",
]
# The geoh5 interchange (`data/geoh5.py`): `pip install geoml[geoh5]`.
# Floored at the version the round trips were verified against; the
# `value_map` representation has moved between geoh5py releases, so an
# older floor would be a guess presented as a fact.
geoh5 = [
    "geoh5py>=0.13",
]

[project.urls]
Homepage = "http://github.com/italo-goncalves/geoML"

# The type check covers the annotated public interface and grows with it.
# `data/variables.py` is annotated but not yet listed: its columns are
# declared, which is what the editor reads, and the ~20 sites that guard a
# missing simulations store by hand have still to be made legible to the
# checker.
# The tensor internals are deliberately unannotated -- a `tf.Tensor` in and
# a `tf.Tensor` out says nothing about the rank, dtype or axis order that
# actually goes wrong there, and tensorflow-probability ships no stubs, so
# a checker could not verify that half of the package anyway.
[tool.pyright]
# Every user-facing module, which since 0.6.5 means all thirteen named in
# `geoml.__all__` and everything under them -- except `latent/network.py`
# and the likelihood/kernel tensor maths, left bare on purpose (see the
# typing note in CLAUDE.md). A module that is annotated but absent from this
# list is the worst of both worlds: the annotations are read by the editor
# and checked by nobody, which is how the three `plots` modules drifted
# between 0.6.4 and 0.6.5.
include = [
    "geoml/_types.py",
    "geoml/models.py",
    "geoml/metrics.py",
    "geoml/likelihood.py",
    "geoml/kernels.py",
    "geoml/transform.py",
    "geoml/warping.py",
    "geoml/storage.py",
    "geoml/datasets.py",
    "geoml/data/inducing.py",
    "geoml/data/containers.py",
    "geoml/data/variables.py",
    "geoml/data/grids.py",
    "geoml/data/blocks.py",
    "geoml/data/meshes.py",
    "geoml/data/geoh5.py",
    "geoml/data/drillhole.py",
    "geoml/plots/base.py",
    "geoml/plots/prepare.py",
    "geoml/plots/explorer.py",
    "geoml/plots/interactive.py",
    "geoml/plots/dashboard.py",
    "geoml/viz/plotly.py",
    "geoml/viz/pyvista.py",
    "geoml/viz/graphviz.py",
    "geoml/math/geometry.py",
    "geoml/math/tf.py",
    "geoml/stats/random.py",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
reportMissingImports = false
reportMissingModuleSource = false
# `typings/tensorflow` declares that module untyped on purpose -- see the
# comment in it.
stubPath = "typings"

# Subpackages are discovered automatically -- no hand-maintained list.
[tool.setuptools.packages.find]
include = ["geoml*"]
exclude = ["geoml.test*"]

[tool.setuptools.package-data]
geoml = ["sample_data/*.dat", "sample_data/*.csv", "sample_data/*.xlsx"]
